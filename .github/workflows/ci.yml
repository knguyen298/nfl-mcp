name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # docker.yml runs this whole workflow before it publishes an image.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NFL_MCP_DB_PATH: ${{ github.workspace }}/.nfl-mcp-ci/nflread.duckdb
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Ingest all datasets for E2E tests
        # A failed fetch makes `nfl-mcp ingest` exit non-zero, which is what `update_db.sh` needs
        # before it swaps slots. In CI one dropped connection should not fail a build, so try three
        # times and still fail if every attempt fails.
        run: |
          for attempt in 1 2 3; do
            if nfl-mcp ingest --dataset all --start 2024 --end 2024; then
              exit 0
            fi
            echo "ingest attempt $attempt failed, retrying"
            sleep 20
          done
          exit 1

      - name: Run tests with coverage
        # --cov-fail-under=100 gates the build on no coverage regression.
        # Kept on the CI command (not pyproject addopts) so local unit-only
        # runs (`pytest -m unit`) are not held to the full-suite floor.
        run: pytest -q --cov-fail-under=100

      - name: Type and lint counts must not rise
        # Ceilings, not zero: the code carried these findings when the step was added. A PR
        # that fixes some lowers the number here in the same commit. To raise a ceiling,
        # change the number in its own commit and say in the PR which finding is new and why
        # it stays. Never silence a finding with a comment to stay under it.
        run: |
          mypy_errors=$(mypy nfl_mcp | grep -c ': error:' || true)
          ruff_findings=$(ruff check nfl_mcp tests --output-format json \
            | python -c 'import json, sys; print(len(json.load(sys.stdin)))')
          echo "mypy: $mypy_errors errors (ceiling 15), ruff: $ruff_findings findings (ceiling 98)"
          test "$mypy_errors" -le 15
          test "$ruff_findings" -le 98

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
