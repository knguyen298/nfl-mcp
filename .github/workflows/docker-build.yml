name: Docker build check

# Validates that the container image still builds when Docker-relevant files
# change. To keep this fast, the PR build does a lightweight single-season
# ingest via the INGEST_ARGS build arg instead of the full nflverse bake that
# release/scheduled builds (docker.yml) perform. The image is built but never
# pushed — this job only proves the build + bake-validation pipeline is intact.

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.dev
      - entrypoint.sh
      - update_db.sh
      - .dockerignore
      - pyproject.toml
      - nfl_mcp/**
      - .github/workflows/docker-build.yml

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (lightweight ingest, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: nfl-mcp:ci
          build-args: |
            INGEST_ARGS=--dataset all --start 2024 --end 2024
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — container answers a real tool call
        # initialize must answer 2xx, then nfl_status must come back with isError false. Any
        # other status, or a tool error, fails the job: the old check passed on any HTTP code.
        run: |
          docker run -d --name nfl-mcp-ci -p 8000:8000 nfl-mcp:ci
          url=http://localhost:8000/mcp
          hdr='-H Content-Type:application/json -H Accept:application/json,text/event-stream'
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -D headers.txt -o init.txt -w "%{http_code}" $hdr -d "$init" "$url" || true)
            case "$code" in 2??) break ;; esac
            sleep 2
          done
          echo "initialize answered HTTP $code"
          case "$code" in 2??) ;; *) docker logs nfl-mcp-ci || true; exit 1 ;; esac
          sid=$(grep -i '^mcp-session-id:' headers.txt | cut -d' ' -f2 | tr -d '\r')
          curl -sf $hdr -H "Mcp-Session-Id: $sid" \
            -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' "$url" > /dev/null
          curl -sf $hdr -H "Mcp-Session-Id: $sid" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"nfl_status","arguments":{}}}' \
            "$url" > call.txt
          if grep -q '"isError":false' call.txt && grep -q 'total_plays' call.txt; then
            echo "nfl_status answered without an error"
          else
            cat call.txt; docker logs nfl-mcp-ci || true; exit 1
          fi

      - name: Build the dev image (no seed, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.dev
          push: false
          tags: nfl-mcp:ci-dev
          cache-from: type=gha

      - name: Tear down container
        if: always()
        run: docker rm -f nfl-mcp-ci || true
