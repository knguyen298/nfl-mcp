name: Docker build check

# Validates that the container image still builds when Docker-relevant files
# change. To keep this fast, the PR build does a lightweight single-season
# ingest via the INGEST_ARGS build arg instead of the full nflverse bake that
# release/scheduled builds (docker.yml) perform. The image is built but never
# pushed — this job only proves the build + bake-validation pipeline is intact.

on:
  pull_request:
    branches: [main]
    # Every file that changes the image or how the image runs. If a file is missing here, a
    # pull request can edit the updater or the schedule and no build check ever runs.
    # `crontab` does not exist yet (entrypoint.sh writes the schedule today); keep the name so
    # a future split into its own file still triggers this job.
    paths:
      - Dockerfile
      - Dockerfile.dev
      - .dockerignore
      - pyproject.toml
      - entrypoint.sh
      - update_db.sh
      - validate_db.sh
      - crontab
      - nfl_mcp/**
      - .github/workflows/docker-build.yml

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (lightweight ingest, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: nfl-mcp:ci
          build-args: |
            INGEST_ARGS=--dataset all --start 2024 --end 2024
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — container boots and answers the MCP endpoint
        run: |
          docker run -d --name nfl-mcp-ci -p 8000:8000 nfl-mcp:ci
          # The server registers two routes: /mcp for the protocol and /healthz, which reports
          # whether the database opens. Ask /mcp what a client asks: an initialize request.
          # A server that works answers 200. A 4xx or a 5xx means the container is up but the
          # app is broken, so it fails here. The check this one replaced accepted any HTTP
          # response, so it passed on an HTTP 500.
          status=1
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /tmp/mcp-initialize.txt -w '%{http_code}' -m 10 -X POST \
              http://localhost:8000/mcp \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","clientInfo":{"name":"ci-smoke","version":"0"},"capabilities":{}}}' \
              || echo 000)
            if [ "$code" = "200" ] && grep -q '"result"' /tmp/mcp-initialize.txt; then
              echo "Server answered initialize with HTTP $code"
              status=0
              break
            fi
            echo "attempt $attempt: HTTP $code, retrying"
            sleep 2
          done
          if [ "$status" -ne 0 ]; then
            echo "Server did not answer initialize on /mcp with HTTP 200 within 60s"
            docker logs nfl-mcp-ci || true
          fi
          exit "$status"

      - name: Tear down container
        if: always()
        run: docker rm -f nfl-mcp-ci || true
